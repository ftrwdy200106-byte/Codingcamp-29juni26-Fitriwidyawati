<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <section class="widget greeting-widget">
            <h1 id="time-display">00:00:00</h1>
            <p id="date-display">Date</p>
            <h2 id="greeting-message">Good Day</h2>
        </section>

        <section class="widget timer-widget">
            <h3>Focus Timer</h3>
            <input type="number" id="timer-input" placeholder="Minutes (default 25)" style="width: 100%; margin-bottom: 10px;">
            <div id="timer-display">25:00</div>
            <div class="timer-controls">
                <button id="start-btn">Start</button>
                <button id="stop-btn">Stop</button>
                <button id="reset-btn">Reset</button>
            </div>
        </section>

        <section class="widget todo-widget">
            <h3>Tasks</h3>
            <div class="todo-input-container">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button id="add-task-btn">Add</button>
            </div>
            <ul id="task-list"></ul>
        </section>

        <section class="widget links-widget">
            <h3>Quick Links</h3>
            <div class="link-input-container">
                <input type="text" id="link-name" placeholder="Name">
                <input type="text" id="link-url" placeholder="URL">
                <button id="add-link-btn">Add Link</button>
            </div>
            <div id="links-container"></div>
        </section>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
